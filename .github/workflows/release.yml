name: release

# Manual dispatch validates all release artifacts without publishing them.
# A version tag publishes only after every platform job succeeds.
on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  RUSTFLAGS: "-Dwarnings"
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: build-eips-ubuntu.tar.xz
          - os: windows-latest
            archive: build-eips-windows.zip
          - os: macos-latest
            archive: build-eips-macos-arm64.tar.xz
          - os: macos-15-intel
            archive: build-eips-macos-x86_64.tar.xz
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # 4.2.2
        with:
          persist-credentials: false

      - name: Install tested Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.91.1 --profile default --no-self-update
          rustup default 1.91.1
          cargo --version

      - name: Test exact source
        shell: bash
        run: cargo test --locked

      - name: Compile optimized binary
        shell: bash
        run: cargo build --locked --release --bin build-eips

      - name: Verify executable and tag version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            binary=target/release/build-eips.exe
          else
            binary=target/release/build-eips
          fi
          expected=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          actual=$("$binary" --version)
          test "$actual" = "build-eips $expected"
          "$binary" --help >/dev/null
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v$expected"
          fi
          echo "Verified $actual on $RUNNER_OS ($RUNNER_ARCH)"

      - name: Package Windows binary and SHA-256
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCHIVE_NAME: ${{ matrix.archive }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $archivePath = Join-Path (Resolve-Path dist) $env:ARCHIVE_NAME
          Compress-Archive -LiteralPath target/release/build-eips.exe -DestinationPath $archivePath
          $digest = (Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$archivePath.sha256", "$digest  $env:ARCHIVE_NAME`n")

      - name: Package Unix binary and SHA-256
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARCHIVE_NAME: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -cJf "dist/$ARCHIVE_NAME" -C target/release build-eips
          (cd dist && if command -v sha256sum >/dev/null; then
            sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          else
            shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          fi)

      - name: Verify release archive
        shell: bash
        env:
          ARCHIVE_NAME: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          cd dist
          test -s "$ARCHIVE_NAME"
          test -s "$ARCHIVE_NAME.sha256"
          if command -v sha256sum >/dev/null; then
            sha256sum --check "$ARCHIVE_NAME.sha256"
          else
            shasum -a 256 --check "$ARCHIVE_NAME.sha256"
          fi
          if [[ "$ARCHIVE_NAME" == *.zip ]]; then
            unzip -Z1 "$ARCHIVE_NAME" | grep -Fx 'build-eips.exe'
          else
            tar -tJf "$ARCHIVE_NAME" | grep -Fx 'build-eips'
          fi

      - name: Stage verified artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # 4.6.0
        with:
          name: ${{ matrix.archive }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: build-eips-*
          path: dist
          merge-multiple: true

      - name: Verify complete four-platform artifact set
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for name in build-eips-ubuntu.tar.xz build-eips-windows.zip \
                      build-eips-macos-arm64.tar.xz build-eips-macos-x86_64.tar.xz; do
            test -s "$name"
            test -s "$name.sha256"
            sha256sum --check "$name.sha256"
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 8

      - name: Publish release (only after all builds pass)
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          draft: false
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
